services:
  - type: web
    name: hikaya
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hikaya-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_MODEL
        value: claude-sonnet-5-5

databases:
  - name: hikaya-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
